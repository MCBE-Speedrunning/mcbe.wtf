<!DOCTYPE html>
<html lang="{{ or site.Language.Locale site.Language.Lang }}" dir="{{ or site.Language.Direction `ltr` }}" data-color-scheme="dark">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <header class="mcbe-header">
    {{ partial "header.html" . }}
  </header>
  <main id="main-content" class="mcbe-content">
    {{ block "main" . }}{{ end }}
  </main>
  <footer class="mcbe-footer">
    {{ partial "footer.html" . }}
  </footer>
</body>
</html>
